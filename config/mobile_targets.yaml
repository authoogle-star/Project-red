# Mobile Security Testing - Authorized Targets
# Only devices listed here can be targeted for testing
# IMPORTANT: This is for IN-HOUSE team testing only

authorized_targets:
  # iOS Devices
  - type: phone
    value: "+447575960046"  # Replace with actual authorized phone number
    device_type: ios
    device_name: "Test iPhone - Security Team Member 1"
    owner: "security_team_member_1"
    status: active
    authorized_by: "security_director"
    authorization_date: "2024-01-01"
    notes: "Primary iOS test device"

  - type: email
    value: "ios-test@yourcompany.com"  # Replace with actual authorized email
    device_type: ios
    device_name: "Test iPhone - Email Testing"
    owner: "security_team_member_1"
    status: active
    authorized_by: "security_director"
    authorization_date: "2024-01-01"
    notes: "Email-based iOS testing"

  # Android Devices
  - type: phone
    value: "+447575960046"  # Replace with actual authorized phone number
    device_type: android
    device_name: "Test Android - Security Team Member 2"
    owner: "security_team_member_2"
    status: active
    authorized_by: "security_director"
    authorization_date: "2024-01-01"
    notes: "Primary Android test device"

  - type: email
    value: "android-test@yourcompany.com"  # Replace with actual authorized email
    device_type: android
    device_name: "Test Android - Email Testing"
    owner: "security_team_member_2"
    status: active
    authorized_by: "security_director"
    authorization_date: "2024-01-01"
    notes: "Email-based Android testing"

