# Red Team / Blue Team Exercise Configuration
exercise_config:
  current_exercise: null
  exercise_name: "Mobile Security Assessment 2024"
  start_date: null
  end_date: null
  red_team_members:
    - "red_team_operator_1"
    - "red_team_operator_2"
  blue_team_members:
    - "blue_team_analyst_1"
    - "blue_team_analyst_2"
  notification_email: "security-team@yourcompany.com"

# Test Types Configuration
allowed_test_types:
  ios:
    - phishing
    - smishing
    - malicious_profile
    - webkit_test
  android:
    - phishing
    - smishing
    - malicious_apk
    - bluetooth_test

# Safety Controls
safety:
  max_tests_per_target_per_day: 1000
  max_concurrent_tests: 5000
  require_manual_approval: false
  auto_cleanup: false
  test_window:
    start_hour: 00  # 9 AM
    end_hour: 24   # 5 PM
    timezone: "America/New_York"

